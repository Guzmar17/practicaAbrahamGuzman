# Every push: a clean environment from uv.lock, the page checked and built, every test run.
# A red pipeline is what the teacher sees first (R10: 0 points if it does not run after a clean `uv sync`).
image: ghcr.io/astral-sh/uv:python3.14-bookworm-slim

variables:
  UV_CACHE_DIR: .uv-cache
  UV_LINK_MODE: copy

cache:
  key:
    files: [uv.lock]
  paths: [.uv-cache]

test:
  script:
    - uv sync --frozen
    - uv run --frozen oxid check app/app.py
    - uv run --frozen pytest -q
    - uv run --frozen oxid build app --out www
