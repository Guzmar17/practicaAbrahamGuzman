[project]
name = "ecb-microbiology"
version = "0.1.0"
description = "ECB A1-P1: half a year of a microbiology network, analysed, anonymised and served"
requires-python = ">=3.14"
dependencies = ["oxid==0.27.1", "polars==2.0.0", "patito==0.8.6"]

[dependency-groups]
dev = ["pytest", "ruff"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120

[tool.ruff.lint.isort]
known-first-party = ["microbiology", "server", "conftest"]
